[package]
name = "deterministic_gate"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[[bench]]
name = "callgrind_gate"
path = "benches/callgrind_gate.rs"
harness = false

[dependencies]
bevy_abi_mod_sys = { path = "../../crates/bevy_abi_mod_sys" }
bevy_abi_mod_host_sys = { path = "../../crates/bevy_abi_mod_host_sys" }
bevy_abi_mod_host = { path = "../../crates/bevy_abi_mod_host" }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "async_executor"] }
bevy_app = { version = "0.20.1", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
iai-callgrind = "0.16"
