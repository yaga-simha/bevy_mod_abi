name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # 1. Core Static Quality, Docs, SemVer, Deny, Typos & 32-bit/Wasm Wire Checks
  # ============================================================================
  quality-gates:
    name: Quality, Docs, Deny, Typos & Wire Targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain + 32-bit & Wasm targets
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: i686-unknown-linux-gnu, wasm32-unknown-unknown

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Spellcheck repository (`typos`)
        uses: crate-ci/typos@v1.31.1

      - name: Supply-chain, license & duplicate-Bevy audit (`cargo-deny`)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

      - name: Formatting, workspace lint/clippy (`--all-features`), zero-Bevy isolation & header checks
        run: |
          cargo fmt --all -- --check
          cargo xtask lint
          cargo xtask header --check --test-c99
          cargo xtask gen-component-headers --check
          if cargo tree -p bevy_abi_mod_sys -p bevy_abi_mod_macros -p bevy_abi_mod_guest_sys -p bevy_abi_mod_guest -p cargo-bam | grep -v bevy_abi_mod | grep -i bevy; then
            echo "ERROR: Unexpected Bevy dependency found in isolated ABI/macro/guest/CLI crates!"
            exit 1
          fi
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings

      - name: Strict rustdoc warnings check
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --workspace --no-deps
          cargo doc --workspace --no-deps --all-features

      - name: 32-bit (`i686`) & `wasm32` ABI contract layout checks
        run: |
          cargo check -p bevy_abi_mod_sys --target i686-unknown-linux-gnu
          cargo check -p bevy_abi_mod_sys --target wasm32-unknown-unknown

      - name: SemVer compatibility check on `bevy_abi_mod_sys`
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: bevy_abi_mod_sys
          baseline-rev: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}

      - name: Build mdBook developer guide
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.48"
      - name: Render `docs/book`
        run: mdbook build docs/book

  # ============================================================================
  # 2. Cross-Platform Default Workspace Parallel Test Matrix
  # ============================================================================
  test-matrix:
    name: Test Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cross-OS clippy (`--all-features`), hermetic fixtures, workspace & `cargo-bam` suites
        shell: bash
        run: |
          cargo xtask lint
          cargo xtask header --check --test-c99
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo xtask ci
          cargo test --doc --all-features
          cargo test -p cargo-bam
          cargo test -p bevy_abi_mod_sys -p bevy_abi_mod_macros -p bevy_abi_mod_guest_sys -p bevy_abi_mod_guest --all-features
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo test -p bevy_abi_mod_host_sys -p bevy_abi_mod_host --all-features
          cargo run -p cargo-bam -- doctor
          cargo run -p cargo-bam -- header --out target/ci_sdk_check

  # ============================================================================
  # 3. Heavy GUI / 3D Examples (`04_visual_game`, `05_cute_3d_winit`)
  # ============================================================================
  heavy-examples:
    name: Heavy GUI & 3D Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux X11 / Wayland / ALSA / udev system headers for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev pkg-config

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: heavy-examples

      - name: Check, lint & test `04_visual_game` and `05_cute_3d_winit` + guest mods
        run: |
          cargo xtask fixtures --examples
          cargo clippy -p example_04_visual_game -p example_05_cute_3d_winit --all-targets -- -D warnings
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo test -p example_04_visual_game -p example_05_cute_3d_winit

  # ============================================================================
  # 4. True Asymmetry Matrix: MSRV / Stable / Nightly + O0/O3 + panic=abort + C99 + C++17 + Zig
  # ============================================================================
  asymmetry-rust:
    name: Asymmetric Rust Guest (${{ matrix.guest_toolchain }}, opt=${{ matrix.opt_level }}, panic=${{ matrix.panic_mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - guest_toolchain: "1.95.0"
            opt_level: "0"
            panic_mode: "unwind"
          - guest_toolchain: "1.95.0"
            opt_level: "3"
            panic_mode: "unwind"
          - guest_toolchain: "stable"
            opt_level: "0"
            panic_mode: "unwind"
          - guest_toolchain: "stable"
            opt_level: "3"
            panic_mode: "abort"
          - guest_toolchain: "nightly"
            opt_level: "0"
            panic_mode: "unwind"
          - guest_toolchain: "nightly"
            opt_level: "3"
            panic_mode: "abort"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable host toolchain + ${{ matrix.guest_toolchain }} guest toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install "${{ matrix.guest_toolchain }}" --profile minimal

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: asym-rust-${{ matrix.guest_toolchain }}-o${{ matrix.opt_level }}-${{ matrix.panic_mode }}

      - name: Stage base fixtures with stable host, then rebuild asymmetric Rust guests
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.opt_level }}
          CARGO_PROFILE_RELEASE_PANIC: ${{ matrix.panic_mode }}
        run: |
          cargo +stable xtask fixtures
          cargo "+${{ matrix.guest_toolchain }}" build \
            --manifest-path tests/asymmetric_rust_mod/Cargo.toml \
            --release
          cp tests/asymmetric_rust_mod/target/release/libasymmetric_rust_mod.so \
             target/fixtures/libasymmetric_rust_mod.so
          if [ "${{ matrix.panic_mode }}" = "abort" ]; then
            cargo "+${{ matrix.guest_toolchain }}" build \
              --manifest-path tests/fixtures/panic_abort_mod/Cargo.toml \
              --release
            cp tests/fixtures/panic_abort_mod/target/release/libpanic_abort_mod.so \
               target/fixtures/libpanic_abort_mod.so
          fi

      - name: Load asymmetric guest into stable host & execute integration suites
        env:
          BAM_FIXTURE_DIR: "${{ github.workspace }}/target/fixtures"
        run: |
          if [ "${{ matrix.panic_mode }}" = "unwind" ]; then
            cargo +stable test -p bevy_abi_mod_host
          else
            # Under `panic=abort`, skip the in-process `test_cross_runtime_panic_containment` unwind test
            # and verify deterministic subprocess abort via `panic_abort_guest_terminates_subprocess`.
            cargo +stable test -p bevy_abi_mod_host --test ffi
            cargo +stable test -p bevy_abi_mod_host --test scheduling -- --skip test_cross_runtime_panic_containment
            cargo +stable test -p bevy_abi_mod_host --test lifecycle panic_abort_guest_terminates_subprocess
          fi

  asymmetry-polyglot:
    name: Cross-OS Polyglot & E2E Matrix (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: macos-latest
            cc: clang
            cxx: clang++
          - os: windows-latest
            cc: gcc
            cxx: g++
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Zig toolchain (`goto-bus-stop/setup-zig`)
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: polyglot-${{ matrix.os }}-${{ matrix.cc }}

      - name: Validate strict C99 (`${{ matrix.cc }}`), C++17 (`07_cpp17_guest`), Zig (`08_zig_guest`) & E2E (${{ matrix.os }})
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cargo xtask lint
          cargo xtask header --check --test-c99
          cargo xtask fixtures
          cargo test -p cargo-bam
          cargo run -p cargo-bam -- doctor --require-c
          if [ "${{ runner.os }}" = "Windows" ]; then
            "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Iinclude -O3 -shared examples/07_cpp17_guest/cpp_mod/mod.cpp -o examples/07_cpp17_guest/cpp_mod/cpp17_mod.dll
          elif [ "${{ runner.os }}" = "macOS" ]; then
            "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Iinclude -O3 -shared -fPIC -fvisibility=hidden -fvisibility-inlines-hidden examples/07_cpp17_guest/cpp_mod/mod.cpp -o examples/07_cpp17_guest/cpp_mod/libcpp17_mod.dylib
          else
            "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Iinclude -O3 -shared -fPIC -fvisibility=hidden -fvisibility-inlines-hidden examples/07_cpp17_guest/cpp_mod/mod.cpp -o examples/07_cpp17_guest/cpp_mod/libcpp17_mod.so
          fi
          (cd examples/08_zig_guest/zig_mod && zig build -Doptimize=ReleaseFast)
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo test -p example_07_cpp17_guest -p example_08_zig_guest
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo test -p bevy_abi_mod_host --test e2e --all-features
          cargo run -p example_07_cpp17_guest
          cargo run -p example_08_zig_guest

  # ============================================================================
  # 5. Deterministic Benchmark Gate (`iai-callgrind` + Smoke Bench)
  # ============================================================================
  benchmark-gate:
    name: Deterministic Callgrind & Benchmark Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Valgrind + `iai-callgrind-runner`
        uses: dtolnay/rust-toolchain@stable

      - name: Install Valgrind & iai-callgrind-runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          cargo install iai-callgrind-runner --version 0.16.1 --locked

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-gate

      - name: Run deterministic `iai-callgrind` gate & `chunk_throughput --test`
        run: |
          cargo xtask fixtures
          cargo bench --manifest-path benches/deterministic_gate/Cargo.toml
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo bench -p bevy_abi_mod_host --bench chunk_throughput -- --test

  # ============================================================================
  # 6. Line Coverage Gate (`>= 85%` on `ffi/` and `system/`)
  # ============================================================================
  coverage:
    name: Coverage Gate (>=85% ffi/ & system/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust with `llvm-tools-preview`
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install `cargo-llvm-cov`
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: llvm-cov

      - name: Build fixtures & enforce >= 85% line coverage on `ffi/` and `system/`
        run: |
          cargo xtask fixtures
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo llvm-cov --no-report \
              --all-features \
              -p bevy_abi_mod_host_sys \
              -p bevy_abi_mod_host
          cargo llvm-cov report \
            --ignore-filename-regex '(crates/bevy_abi_mod_host_sys/src/(drop_trampoline|handle_header|lib|loader|registry|schedule|sync_ptr)|crates/bevy_abi_mod_(host|macros|sys|guest|guest_sys)/|tests/)' \
            --fail-under-lines 85

  # ============================================================================
  # 7. Miri Soundness, Tree Borrows & ASan/UBSan
  # ============================================================================
  miri:
    name: Miri (-Zmiri-tree-borrows)
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: "-Zmiri-tree-borrows"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nightly Rust with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Setup Miri sysroot
        run: cargo +nightly miri setup

      - name: Cache Cargo & Miri artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: miri-tree-borrows

      - name: Run Miri via `cargo xtask miri --all`
        run: cargo xtask miri --all

  loom:
    name: Loom Atomic Concurrency Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: loom-concurrency

      - name: Verify `DROP_SLOTS` generation/epoch atomics under Loom
        run: cargo test -p bevy_abi_mod_host_sys --test loom_drop_trampoline --release

  sanitizers:
    name: ASan / UBSan C99 Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run `standalone_c_test` under AddressSanitizer + UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: "detect_leaks=1:strict_string_checks=1:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          mkdir -p target
          clang -std=c99 -Wall -Wextra -Werror -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Iinclude tests/standalone_c_test.c \
            -o target/standalone_c_test_san
          ./target/standalone_c_test_san

      - name: Build UBSan-instrumented C99 guest mod & run host integration suites
        env:
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          cargo xtask fixtures
          clang -std=c99 -Wall -Wextra -Werror -O1 -g -fno-omit-frame-pointer \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -Iinclude -shared -fPIC \
            tests/asymmetric_c_mod/mod.c \
            -o tests/asymmetric_c_mod/libasymmetric_c_mod.so
          cp tests/asymmetric_c_mod/libasymmetric_c_mod.so target/fixtures/libasymmetric_c_mod.so
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo test -p bevy_abi_mod_host
