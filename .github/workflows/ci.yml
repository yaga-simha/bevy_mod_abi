name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # 1. Core Static Quality, Docs, SemVer, Deny, Typos & 32-bit/Wasm Wire Checks
  # ============================================================================
  quality-gates:
    name: Quality, Docs, Deny, Typos & Wire Targets
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Linux X11 / Wayland / ALSA / udev system headers for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev libegl-dev libxcursor-dev libxrandr-dev libxinerama-dev pkg-config

      - name: Install stable Rust toolchain + 32-bit & Wasm targets
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: i686-unknown-linux-gnu, wasm32-unknown-unknown

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Spellcheck repository (`typos`)
        uses: crate-ci/typos@v1.31.1

      - name: Install `cargo-deny`
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Supply-chain, license & duplicate-Bevy audit (`cargo-deny`)
        run: cargo deny --all-features check advisories licenses bans sources

      - name: Formatting, workspace lint/clippy (`--all-features`), zero-Bevy isolation & header checks
        run: |
          cargo fmt --all -- --check
          cargo xtask lint
          cargo xtask header --check --test-c99
          cargo xtask gen-component-headers --check
          if cargo tree -p bevy_abi_mod_sys -p bevy_abi_mod_macros -p bevy_abi_mod_guest_sys -p bevy_abi_mod_guest -p bevy_abi_mod_trust -p bevy_abi_mod_manifest -p bevy_abi_mod_sdk_gen -p cargo-bam | sed 's/ (.*//' | grep -v bevy_abi_mod | grep -i bevy; then
            echo "ERROR: Unexpected Bevy dependency found in isolated ABI/macro/guest/CLI crates!"
            exit 1
          fi
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings

      - name: Strict rustdoc warnings check
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --workspace --no-deps
          cargo doc --workspace --no-deps --all-features

      - name: 32-bit (`i686`) & `wasm32` ABI contract layout checks
        run: |
          cargo check -p bevy_abi_mod_sys --target i686-unknown-linux-gnu
          cargo check -p bevy_abi_mod_sys --target wasm32-unknown-unknown

      - name: Install `cargo-semver-checks`
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: SemVer compatibility check on `bevy_abi_mod_sys`
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          extract_toml_version() {
            local section="$1"
            awk -v sec="$section" '
              /^\[/ {
                hdr = $0
                sub(/[[:space:]]*(#.*)?$/, "", hdr)
                in_sec = (hdr == "[" sec "]")
                next
              }
              in_sec && !done && /^[[:space:]]*version[[:space:]]*=[[:space:]]*"/ {
                line = $0
                sub(/^[^"]*"/, "", line)
                sub(/".*$/, "", line)
                print line
                done = 1
              }
            '
          }

          read_sys_ver() {
            local rev="$1"
            local pkg_toml ws_toml
            if [ "$rev" = "WORKTREE" ]; then
              pkg_toml="$(cat crates/bevy_abi_mod_sys/Cargo.toml)"
              ws_toml="$(cat Cargo.toml)"
            else
              pkg_toml="$(git show "${rev}:crates/bevy_abi_mod_sys/Cargo.toml" 2>/dev/null || true)"
              ws_toml="$(git show "${rev}:Cargo.toml" 2>/dev/null || true)"
            fi
            [ -n "$pkg_toml" ] || return 0
            if printf '%s\n' "$pkg_toml" | awk '
              /^\[/ {
                hdr = $0
                sub(/[[:space:]]*(#.*)?$/, "", hdr)
                in_pkg = (hdr == "[package]")
                next
              }
              in_pkg && ( \
                /^[[:space:]]*version\.workspace[[:space:]]*=[[:space:]]*true/ || \
                /^[[:space:]]*version[[:space:]]*=[[:space:]]*\{[^}]*workspace[[:space:]]*=[[:space:]]*true/ \
              ) {
                found = 1
              }
              END { exit(found ? 0 : 1) }
            '; then
              printf '%s\n' "$ws_toml" | extract_toml_version "workspace.package"
            else
              printf '%s\n' "$pkg_toml" | extract_toml_version "package"
            fi
          }

          CUR_VER="$(read_sys_ver WORKTREE)"
          if [ -z "$CUR_VER" ]; then
            echo "ERROR: could not read current bevy_abi_mod_sys version." >&2
            exit 1
          fi
          CUR_MM="$(printf '%s' "$CUR_VER" | cut -d. -f1,2)"
          LATEST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"

          if [ -n "$LATEST_TAG" ]; then
            TAG_VER="$(read_sys_ver "$LATEST_TAG")"
            TAG_MM="$(printf '%s' "$TAG_VER" | cut -d. -f1,2)"
            if [ -n "$TAG_VER" ] && [ "$TAG_MM" = "$CUR_MM" ]; then
              echo "Running cargo-semver-checks against release tag $LATEST_TAG ($TAG_VER) for $CUR_VER."
              cargo semver-checks check-release -p bevy_abi_mod_sys --baseline-rev "$LATEST_TAG"
              exit 0
            fi
            echo "Skipping release-tag baseline $LATEST_TAG (${TAG_VER:-unknown}, major.minor=${TAG_MM:-unknown}): intentional bump to $CUR_VER (major.minor=$CUR_MM)."
          else
            echo "No reachable v* release tag found yet; skipping tag-based SemVer baseline for $CUR_VER."
          fi

          if [ -n "${PR_BASE:-}" ]; then
            BASE_VER="$(read_sys_ver "$PR_BASE")"
            if [ "$BASE_VER" = "$CUR_VER" ]; then
              echo "Running cargo-semver-checks against PR base $PR_BASE ($BASE_VER)."
              cargo semver-checks check-release -p bevy_abi_mod_sys --baseline-rev "$PR_BASE"
            else
              echo "Skipping PR base $PR_BASE (${BASE_VER:-unknown}): bevy_abi_mod_sys version changed ($BASE_VER -> $CUR_VER)."
            fi
          else
            echo "No matching release tag or PR base baseline applies on this push; SemVer check complete."
          fi

      - name: Install `mdbook`
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.48
      - name: Render `docs/book`
        run: mdbook build docs/book

  # ============================================================================
  # 2. Cross-Platform Default Workspace Parallel Test Matrix
  # ============================================================================
  test-matrix:
    name: Test Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free disk space on Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h

      - name: Install Linux X11 / Wayland / ALSA / udev system headers for Bevy
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev libegl-dev libxcursor-dev libxrandr-dev libxinerama-dev pkg-config

      - name: Initialize MSVC Developer Environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cross-OS clippy (`--all-features`), hermetic fixtures, workspace & `cargo-bam` suites
        shell: bash
        run: |
          if [ -n "${VCToolsInstallDir:-}" ] && command -v cygpath >/dev/null 2>&1; then
            MSVC_BIN="$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")"
            if [ -x "${MSVC_BIN}/link.exe" ]; then
              export PATH="${MSVC_BIN}:${PATH}"
            fi
          fi
          cargo xtask lint
          cargo xtask header --check --test-c99
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo xtask ci
          cargo test --doc --all-features
          cargo test -p cargo-bam
          cargo test -p bevy_abi_mod_sys -p bevy_abi_mod_macros -p bevy_abi_mod_guest_sys -p bevy_abi_mod_guest --all-features
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo test -p bevy_abi_mod_host_sys -p bevy_abi_mod_host -p bevy_abi_mod_bridges -p bevy_abi_mod_render -p bevy_abi_mod_reflect -p bevy_abi_mod_watcher -p bevy_abi_mod -p bevy_mod_abi --all-features
          cargo run -p cargo-bam -- doctor
          cargo run -p cargo-bam -- header --out target/ci_sdk_check

      - name: Run 10,000-cycle hot-reload soak gate (Linux release)
        if: runner.os == 'Linux'
        shell: bash
        run: BAM_SOAK_CYCLES=10000 BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" cargo test -p bevy_abi_mod_host --test soak_10k_reloads --release

  # ============================================================================
  # 3. Heavy GUI / 3D Examples (`04_visual_game`, `05_cute_3d_winit`)
  # ============================================================================
  heavy-examples:
    name: Heavy GUI & 3D Examples
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux X11 / Wayland / ALSA / udev system headers for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev libegl-dev libxcursor-dev libxrandr-dev libxinerama-dev pkg-config

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: heavy-examples

      - name: Check, lint & test `04_visual_game` and `05_cute_3d_winit` + guest mods
        run: |
          cargo xtask fixtures --examples
          cargo clippy -p example_04_visual_game -p example_05_cute_3d_winit --all-targets -- -D warnings
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo test -p example_04_visual_game -p example_05_cute_3d_winit

  # ============================================================================
  # 4. True Asymmetry Matrix: MSRV / Stable / Nightly + O0/O3 + panic=abort + C99 + C++17 + Zig
  # ============================================================================
  asymmetry-rust:
    name: Asymmetric Rust Guest (${{ matrix.guest_toolchain }}, opt=${{ matrix.opt_level }}, panic=${{ matrix.panic_mode }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - guest_toolchain: "1.95.0"
            opt_level: "0"
            panic_mode: "unwind"
          - guest_toolchain: "1.95.0"
            opt_level: "3"
            panic_mode: "unwind"
          - guest_toolchain: "stable"
            opt_level: "0"
            panic_mode: "unwind"
          - guest_toolchain: "stable"
            opt_level: "3"
            panic_mode: "abort"
          - guest_toolchain: "nightly"
            opt_level: "0"
            panic_mode: "unwind"
          - guest_toolchain: "nightly"
            opt_level: "3"
            panic_mode: "abort"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable host toolchain + ${{ matrix.guest_toolchain }} guest toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install "${{ matrix.guest_toolchain }}" --profile minimal

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: asym-rust-${{ matrix.guest_toolchain }}-o${{ matrix.opt_level }}-${{ matrix.panic_mode }}

      - name: Stage base fixtures with stable host, then rebuild asymmetric Rust guests
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.opt_level }}
          CARGO_PROFILE_RELEASE_PANIC: ${{ matrix.panic_mode }}
        run: |
          cargo +stable xtask fixtures
          cargo "+${{ matrix.guest_toolchain }}" build \
            --manifest-path tests/asymmetric_rust_mod/Cargo.toml \
            --release
          cp tests/asymmetric_rust_mod/target/release/libasymmetric_rust_mod.so \
             target/fixtures/libasymmetric_rust_mod.so
          if [ "${{ matrix.panic_mode }}" = "abort" ]; then
            cargo "+${{ matrix.guest_toolchain }}" build \
              --manifest-path tests/fixtures/panic_abort_mod/Cargo.toml \
              --release
            cp tests/fixtures/panic_abort_mod/target/release/libpanic_abort_mod.so \
               target/fixtures/libpanic_abort_mod.so
          fi

      - name: Load asymmetric guest into stable host & execute integration suites
        env:
          BAM_FIXTURE_DIR: "${{ github.workspace }}/target/fixtures"
        run: |
          if [ "${{ matrix.panic_mode }}" = "unwind" ]; then
            cargo +stable test -p bevy_abi_mod_host
          else
            # Under `panic=abort`, skip the in-process `test_cross_runtime_panic_containment` unwind test
            # and verify deterministic subprocess abort via `panic_abort_guest_terminates_subprocess`.
            cargo +stable test -p bevy_abi_mod_host --test ffi
            cargo +stable test -p bevy_abi_mod_host --test scheduling -- --skip test_cross_runtime_panic_containment
            cargo +stable test -p bevy_abi_mod_host --test lifecycle panic_abort_guest_terminates_subprocess
          fi

  asymmetry-polyglot:
    name: Cross-OS Polyglot & E2E Matrix (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            cc: gcc
            cxx: g++
          - os: ubuntu-26.04
            cc: clang
            cxx: clang++
          - os: macos-latest
            cc: clang
            cxx: clang++
          - os: windows-latest
            cc: gcc
            cxx: g++
          - os: windows-latest
            cc: cl.exe
            cxx: cl.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize MSVC Developer Environment
        if: runner.os == 'Windows' && matrix.cc == 'cl.exe'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Linux X11 / Wayland / ALSA / udev system headers for Bevy
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev libegl-dev libxcursor-dev libxrandr-dev libxinerama-dev pkg-config

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Zig 0.16.0 toolchain
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VER="0.16.0"
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)
              ZIG_TARBALL="zig-x86_64-linux-${ZIG_VER}.tar.xz"
              ZIG_SHA256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
              ;;
            macOS-ARM64)
              ZIG_TARBALL="zig-aarch64-macos-${ZIG_VER}.tar.xz"
              ZIG_SHA256="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
              ;;
            macOS-X64)
              ZIG_TARBALL="zig-x86_64-macos-${ZIG_VER}.tar.xz"
              ZIG_SHA256="0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7"
              ;;
            Windows-X64)
              ZIG_TARBALL="zig-x86_64-windows-${ZIG_VER}.zip"
              ZIG_SHA256="68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"
              ;;
            *)
              echo "Unsupported runner OS/arch: ${{ runner.os }}-${{ runner.arch }}" >&2
              exit 1
              ;;
          esac
          ZIG_ARCHIVE="${RUNNER_TEMP}/${ZIG_TARBALL}"
          curl -fsSL --retry 3 "https://ziglang.org/download/${ZIG_VER}/${ZIG_TARBALL}" -o "${ZIG_ARCHIVE}"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${ZIG_SHA256}  ${ZIG_ARCHIVE}" | sha256sum -c -
          else
            echo "${ZIG_SHA256}  ${ZIG_ARCHIVE}" | shasum -a 256 -c -
          fi
          if [[ "${ZIG_TARBALL}" == *.zip ]]; then
            unzip -q -o "${ZIG_ARCHIVE}" -d "${RUNNER_TEMP}"
            ZIG_DIR="${RUNNER_TEMP}/${ZIG_TARBALL%.zip}"
            test -f "${ZIG_DIR}/zig.exe"
            cygpath -w "${ZIG_DIR}" >> "${GITHUB_PATH}"
          else
            tar -xf "${ZIG_ARCHIVE}" -C "${RUNNER_TEMP}"
            ZIG_DIR="${RUNNER_TEMP}/${ZIG_TARBALL%.tar.xz}"
            test -x "${ZIG_DIR}/zig"
            echo "${ZIG_DIR}" >> "${GITHUB_PATH}"
          fi

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: polyglot-${{ matrix.os }}-${{ matrix.cc }}

      - name: Validate strict C99/C11 (`${{ matrix.cc }}`), C++17 (`07_cpp17_guest`), Zig (`08_zig_guest`) & E2E (${{ matrix.os }})
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ -n "${VCToolsInstallDir:-}" ] && command -v cygpath >/dev/null 2>&1; then
            MSVC_BIN="$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")"
            if [ -x "${MSVC_BIN}/link.exe" ]; then
              export PATH="${MSVC_BIN}:${PATH}"
            fi
          fi
          cargo xtask lint
          cargo xtask header --check --test-c99
          cargo xtask fixtures
          cargo test -p cargo-bam
          cargo run -p cargo-bam -- doctor --require-c
          (cd examples/08_zig_guest/zig_mod && zig build -Doptimize=ReleaseFast)
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo test -p example_07_cpp17_guest -p example_08_zig_guest
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo test -p bevy_abi_mod_host --test e2e --all-features
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo test -p bevy_abi_mod --test bridges_integration --all-features
          cargo run -p example_07_cpp17_guest
          cargo run -p example_08_zig_guest

  # ============================================================================
  # 5. Deterministic Benchmark Gate (`iai-callgrind` + Smoke Bench)
  # ============================================================================
  benchmark-gate:
    name: Deterministic Callgrind & Benchmark Gate
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Valgrind + `iai-callgrind-runner`
        uses: dtolnay/rust-toolchain@stable

      - name: Install Valgrind & iai-callgrind-runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          cargo install iai-callgrind-runner --version 0.16.1 --locked

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-gate

      - name: Run deterministic `iai-callgrind` gate & `chunk_throughput --test`
        run: |
          cargo xtask fixtures
          cargo bench --manifest-path benches/deterministic_gate/Cargo.toml
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo bench -p bevy_abi_mod_host --bench chunk_throughput -- --test

  # ============================================================================
  # 6. Line Coverage Gate (`>= 85%` on `ffi/` and `system/`)
  # ============================================================================
  coverage:
    name: Coverage Gate (>=85% ffi/ & system/)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust with `llvm-tools-preview`
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Linux X11 / Wayland / ALSA / udev system headers for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev libegl-dev libxcursor-dev libxrandr-dev libxinerama-dev pkg-config

      - name: Install `cargo-llvm-cov`
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: llvm-cov

      - name: Build fixtures & enforce >= 85% line coverage on `ffi/` and `system/`
        run: |
          cargo xtask fixtures
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo llvm-cov --no-report \
              --all-features \
              -p bevy_abi_mod_host_sys \
              -p bevy_abi_mod_host \
              -p bevy_abi_mod_bridges \
              -p bevy_abi_mod_render \
              -p bevy_abi_mod_reflect \
              -p bevy_abi_mod_watcher
          cargo llvm-cov report \
            --ignore-filename-regex '(crates/bevy_abi_mod_host_sys/src/(drop_trampoline|handle_header|lib|loader|registry|schedule|sync_ptr|ffi/validation)|crates/bevy_abi_mod_(host|bridges|render|reflect|watcher|macros|sys|guest|guest_sys|trust|manifest|sdk_gen)/|crates/bevy_abi_mod/|crates/bevy_mod_abi/|(tests|examples|xtask|benches)/)' \
            --fail-under-lines 85

  # ============================================================================
  # 7. Miri Soundness, Tree Borrows & ASan/UBSan
  # ============================================================================
  miri:
    name: Miri (-Zmiri-tree-borrows)
    runs-on: ubuntu-26.04
    env:
      MIRIFLAGS: "-Zmiri-tree-borrows"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install nightly Rust with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Setup Miri sysroot
        run: cargo +nightly miri setup

      - name: Cache Cargo & Miri artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: miri-tree-borrows

      - name: Run Miri via `cargo xtask miri --all`
        run: cargo xtask miri --all

  loom:
    name: Loom Atomic Concurrency Verification
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: loom-concurrency

      - name: Verify `DROP_PAGES` generation/epoch atomics under Loom
        run: cargo test -p bevy_abi_mod_host_sys --test loom_drop_trampoline --release

  sanitizers:
    name: ASan / UBSan C99 Verification
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run `standalone_c_test` under AddressSanitizer + UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: "detect_leaks=1:strict_string_checks=1:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          mkdir -p target
          clang -std=c99 -Wall -Wextra -Werror -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Iinclude tests/standalone_c_test.c \
            -o target/standalone_c_test_san
          ./target/standalone_c_test_san

      - name: Build UBSan-instrumented C99 guest mod & run host integration suites
        env:
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          cargo xtask fixtures
          clang -std=c99 -Wall -Wextra -Werror -O1 -g -fno-omit-frame-pointer \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -Iinclude -shared -fPIC \
            tests/asymmetric_c_mod/mod.c \
            -o tests/asymmetric_c_mod/libasymmetric_c_mod.so
          cp tests/asymmetric_c_mod/libasymmetric_c_mod.so target/fixtures/libasymmetric_c_mod.so
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo test -p bevy_abi_mod_host
