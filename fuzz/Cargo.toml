[package]
name = "bevy_abi_mod_fuzz"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
improper_ctypes_definitions = "deny"

[dependencies]
libfuzzer-sys = "0.4"
bevy_abi_mod_sys = { path = "../crates/bevy_abi_mod_sys" }
bevy_abi_mod_trust = { path = "../crates/bevy_abi_mod_trust" }
bevy_abi_mod_manifest = { path = "../crates/bevy_abi_mod_manifest" }
bevy_abi_mod_host_sys = { path = "../crates/bevy_abi_mod_host_sys", features = ["strict-ffi-checks", "signature-verification"] }
bevy_abi_mod_host = { path = "../crates/bevy_abi_mod_host", features = ["strict-ffi-checks"] }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "async_executor"] }

[[bin]]
name = "fuzz_read_extensible"
path = "fuzz_targets/fuzz_read_extensible.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_system_desc"
path = "fuzz_targets/fuzz_system_desc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_commands"
path = "fuzz_targets/fuzz_commands.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cstr_array"
path = "fuzz_targets/fuzz_cstr_array.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_sshsig_and_krl"
path = "fuzz_targets/fuzz_sshsig_and_krl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_mod_manifest"
path = "fuzz_targets/fuzz_mod_manifest.rs"
test = false
doc = false
bench = false
