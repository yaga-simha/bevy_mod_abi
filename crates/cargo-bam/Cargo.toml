[package]
name = "cargo-bam"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["bevy_abi_mod authors"]
description = "Safe (`#![forbid(unsafe_code)]`) CLI toolchain (`new`, `export-sdk`, `build`, `check-mods`, `doctor`, `keygen`, `sign`, `verify`) for `bevy_abi_mod`"
readme = "README.md"
repository = "https://github.com/yaga-simha/bevy_mod_abi"
keywords = ["bevy", "ecs", "ffi", "modding", "plugin"]
categories = ["game-development", "api-bindings"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
improper_ctypes_definitions = "deny"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
match_same_arms = "warn"

[lib]
name = "cargo_bam"
path = "src/lib.rs"

[[bin]]
name = "cargo-bam"
path = "src/main.rs"

[dependencies]
bevy_abi_mod_sys = { workspace = true }
bevy_abi_mod_manifest = { workspace = true }
bevy_abi_mod_sdk_gen = { workspace = true }
bevy_abi_mod_trust = { workspace = true, features = ["keygen"] }
clap = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
