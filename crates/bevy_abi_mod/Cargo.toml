[package]
name = "bevy_abi_mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Top-level Bevy host facade for zero-serialization, asymmetric C-ABI native modding (`ABI 0.3.0`)"
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
strict-ffi-checks = ["bevy_abi_mod_host/strict-ffi-checks"]
diagnostics = ["bevy_abi_mod_host/diagnostics"]
signature-verification = ["bevy_abi_mod_host/signature-verification"]
bridge-std-types = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-std-types",
]
bridge-asset = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-asset",
]
bridge-state = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-state",
]
bridge-reflect = ["dep:bevy_abi_mod_reflect"]
bridge-bsn = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-bsn",
    "bridge-asset",
]
sub-app-extract = [
    "dep:bevy_abi_mod_render",
    "bridge-asset",
]
hot-reload-watcher = ["dep:bevy_abi_mod_watcher"]

[dependencies]
bevy_abi_mod_sys = { workspace = true }
bevy_abi_mod_host = { workspace = true }
bevy_abi_mod_macros = { workspace = true }
bevy_abi_mod_bridges = { workspace = true, optional = true }
bevy_abi_mod_render = { workspace = true, optional = true }
bevy_abi_mod_reflect = { workspace = true, optional = true }
bevy_abi_mod_watcher = { workspace = true, optional = true }

[dev-dependencies]
bevy_app = { workspace = true }
bevy_asset = { workspace = true }
bevy_camera = { workspace = true }
bevy_ecs = { workspace = true }
bevy_input = { workspace = true }
bevy_reflect = { workspace = true }
bevy_remote = { workspace = true }
bevy_scene = { workspace = true }
bevy_state = { workspace = true }
bevy_time = { workspace = true }
bevy_transform = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "bridges_integration"
path = "tests/bridges_integration.rs"
required-features = ["bridge-std-types", "bridge-asset", "bridge-state"]
