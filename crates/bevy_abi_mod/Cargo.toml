[package]
name = "bevy_abi_mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Deprecated compatibility shim re-exporting `bevy_mod_abi` (use `bevy_mod_abi` instead)"
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
strict-ffi-checks = ["bevy_mod_abi/strict-ffi-checks"]
diagnostics = ["bevy_mod_abi/diagnostics"]
signature-verification = ["bevy_mod_abi/signature-verification"]
hot-reload-watcher = ["bevy_mod_abi/hot-reload-watcher"]
bridge-std-types = ["bevy_mod_abi/bridge-std-types"]
bridge-asset = ["bevy_mod_abi/bridge-asset"]
bridge-state = ["bevy_mod_abi/bridge-state"]
bridge-reflect = ["bevy_mod_abi/bridge-reflect"]
bridge-bsn = ["bevy_mod_abi/bridge-bsn"]
sub-app-extract = ["bevy_mod_abi/sub-app-extract"]
bridge-picking = ["bevy_mod_abi/bridge-picking"]
bridge-audio = ["bevy_mod_abi/bridge-audio"]
bridge-camera-2d = ["bevy_mod_abi/bridge-camera-2d"]
bridge-light = ["bevy_mod_abi/bridge-light"]
bridge-ui = ["bevy_mod_abi/bridge-ui"]
bridge-feathers = ["bevy_mod_abi/bridge-feathers"]
bridge-camera-controller = ["bevy_mod_abi/bridge-camera-controller"]
bridge-solari = ["bevy_mod_abi/bridge-solari"]
preset-2d = ["bevy_mod_abi/preset-2d"]
preset-3d = ["bevy_mod_abi/preset-3d"]
preset-ui = ["bevy_mod_abi/preset-ui"]
preset-full = ["bevy_mod_abi/preset-full"]

[dependencies]
bevy_mod_abi = { version = "0.3.0", path = "../bevy_mod_abi", default-features = false }
