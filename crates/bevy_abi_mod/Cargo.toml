[package]
name = "bevy_abi_mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Top-level Bevy host facade for zero-serialization, asymmetric C-ABI native modding (`ABI 0.2.0`)"
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
strict-ffi-checks = ["bevy_abi_mod_host/strict-ffi-checks"]
diagnostics = ["bevy_abi_mod_host/diagnostics"]
signature-verification = ["bevy_abi_mod_host/signature-verification"]
bridge-std-types = ["bevy_abi_mod_host/bridge-std-types"]
bridge-asset = ["bevy_abi_mod_host/bridge-asset"]
bridge-state = ["bevy_abi_mod_host/bridge-state"]
bridge-reflect = ["bevy_abi_mod_host/bridge-reflect"]
bridge-bsn = ["bevy_abi_mod_host/bridge-bsn"]
sub-app-extract = ["bevy_abi_mod_host/sub-app-extract"]
hot-reload-watcher = ["bevy_abi_mod_host/hot-reload-watcher"]

[dependencies]
bevy_abi_mod_sys = { workspace = true }
bevy_abi_mod_host = { workspace = true }
bevy_abi_mod_macros = { workspace = true }

[dev-dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
