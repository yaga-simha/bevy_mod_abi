[package]
name = "bevy_abi_mod_host_sys"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["bevy_abi_mod authors"]
description = "Low-level host FFI engine, CoW registry, chunk/sparse iterators, command arena, and dynamic loader for `bevy_abi_mod`"
readme = "README.md"
repository = "https://github.com/yaga-simha/bevy_mod_abi"
keywords = ["bevy", "ecs", "ffi", "modding", "plugin"]
categories = ["game-development", "api-bindings"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
improper_ctypes_definitions = "deny"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
match_same_arms = "warn"

[features]
strict-ffi-checks = []
test-utils = []
diagnostics = []
signature-verification = ["dep:bevy_abi_mod_trust"]
bridge-reflect = ["dep:bevy_reflect", "bevy_ecs/bevy_reflect"]

[dependencies]
bevy_abi_mod_sys = { workspace = true }
bevy_abi_mod_trust = { workspace = true, optional = true }
bevy_ecs = { workspace = true }
bevy_app = { workspace = true }
bevy_platform = { workspace = true }
bevy_tasks = { workspace = true }
bevy_reflect = { workspace = true, optional = true }
libloading = { workspace = true }
nonmax = { workspace = true }
arc-swap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bevy_abi_mod_macros = { workspace = true }
loom = { workspace = true }
proptest = { workspace = true }
ssh-key = { workspace = true, features = ["getrandom"] }
