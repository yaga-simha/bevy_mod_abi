[package]
name = "bevy_abi_mod_bridges"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["bevy_abi_mod authors"]
description = "Safe (`#![forbid(unsafe_code)]`) optional Bevy subsystem bridges (std types, isolated mod:// assets, States, BSN scenes, picking, audio, lighting, and UI) for `bevy_abi_mod`"
readme = "README.md"
repository = "https://github.com/yaga-simha/bevy_mod_abi"
keywords = ["bevy", "ecs", "ffi", "modding", "plugin"]
categories = ["game-development", "api-bindings"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
improper_ctypes_definitions = "deny"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
match_same_arms = "warn"

[features]
default = []
bridge-std-types = [
    "dep:bevy_math",
    "dep:bevy_transform",
    "dep:bevy_camera",
    "dep:bevy_color",
    "dep:bevy_window",
    "dep:bevy_time",
    "dep:bevy_input",
]
bridge-asset = ["dep:bevy_asset"]
bridge-state = ["dep:bevy_state"]
bridge-bsn = [
    "dep:bevy_scene",
    "dep:bevy_reflect",
    "bevy_ecs/bevy_reflect",
    "bridge-asset",
]
bridge-picking = [
    "dep:bevy_picking",
    "dep:bevy_input",
    "bevy_input/gamepad",
    "dep:bevy_window",
    "dep:bevy_camera",
    "dep:bevy_math",
]
bridge-audio = [
    "dep:bevy_audio",
    "dep:bevy_math",
    "bridge-asset",
]
bridge-camera-2d = [
    "dep:bevy_camera",
    "dep:bevy_color",
]
bridge-light = [
    "bridge-camera-2d",
    "dep:bevy_light",
    "dep:bevy_camera",
    "dep:bevy_color",
    "dep:bevy_render",
    "dep:bevy_pbr",
]
bridge-ui = [
    "dep:bevy_ui",
    "dep:bevy_text",
    "dep:bevy_ui_widgets",
    "dep:bevy_input_focus",
    "dep:bevy_color",
    "dep:bevy_asset",
    "dep:bevy_image",
    "dep:bevy_math",
]
bridge-feathers = [
    "bridge-ui",
    "dep:bevy_feathers",
    "dep:bevy_scene",
]
bridge-camera-controller = [
    "dep:bevy_camera_controller",
    "bevy_camera_controller/free_camera",
    "bevy_camera_controller/pan_camera",
    "bevy_camera_controller/pan_orbit_camera",
    "dep:bevy_camera",
    "dep:bevy_math",
]
bridge-solari = [
    "dep:bevy_solari",
    "dep:bevy_image",
    "bevy_image/zstd_rust",
]

# Curated presets
preset-2d = [
    "bridge-std-types",
    "bridge-asset",
    "bridge-state",
    "bridge-picking",
    "bridge-audio",
    "bridge-camera-2d",
    "bridge-ui",
]
preset-3d = [
    "preset-2d",
    "bridge-light",
    "bridge-camera-controller",
    "bridge-bsn",
]
preset-ui = [
    "bridge-std-types",
    "bridge-asset",
    "bridge-picking",
    "bridge-ui",
    "bridge-feathers",
]
preset-full = [
    "preset-3d",
    "preset-ui",
    "bridge-solari",
]

[dependencies]
bevy_abi_mod_sys = { workspace = true }
bevy_abi_mod_host_sys = { workspace = true }
bevy_abi_mod_host = { workspace = true }
bevy_abi_mod_macros = { workspace = true }
bevy_ecs = { workspace = true }
bevy_app = { workspace = true }
bevy_platform = { workspace = true }
bevy_math = { workspace = true, optional = true }
bevy_transform = { workspace = true, optional = true }
bevy_camera = { workspace = true, optional = true }
bevy_color = { workspace = true, optional = true }
bevy_window = { workspace = true, optional = true }
bevy_time = { workspace = true, optional = true }
bevy_input = { workspace = true, optional = true }
bevy_asset = { workspace = true, optional = true }
bevy_image = { workspace = true, optional = true }
bevy_state = { workspace = true, optional = true }
bevy_scene = { workspace = true, optional = true }
bevy_reflect = { workspace = true, optional = true }
bevy_picking = { workspace = true, optional = true }
bevy_audio = { workspace = true, optional = true }
bevy_light = { workspace = true, optional = true }
bevy_render = { workspace = true, optional = true }
bevy_pbr = { workspace = true, optional = true }
bevy_ui = { workspace = true, optional = true }
bevy_text = { workspace = true, optional = true }
bevy_ui_widgets = { workspace = true, optional = true }
bevy_input_focus = { workspace = true, optional = true }
bevy_feathers = { workspace = true, optional = true }
bevy_camera_controller = { workspace = true, optional = true }
bevy_solari = { workspace = true, optional = true }

[dev-dependencies]
bevy_abi_mod_host_sys = { workspace = true, features = ["test-utils"] }
bevy_reflect = { workspace = true }
rodio = { version = "0.22", default-features = false }

[[test]]
name = "bridge_asset"
path = "tests/bridge_asset.rs"
required-features = ["bridge-asset"]

[[test]]
name = "bridge_bsn"
path = "tests/bridge_bsn.rs"
required-features = ["bridge-bsn"]
