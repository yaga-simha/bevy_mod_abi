[package]
name = "bevy_abi_mod_reflect"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["bevy_abi_mod authors"]
description = "Safe (`#![forbid(unsafe_code)]`) dynamic `bevy_reflect`, Bevy Remote Protocol (`bevy_remote` BRP), and `bevy_settings` TOML bridges for `bevy_abi_mod`"
readme = "README.md"
repository = "https://github.com/yaga-simha/bevy_mod_abi"
keywords = ["bevy", "ecs", "ffi", "modding", "plugin"]
categories = ["game-development", "api-bindings"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
improper_ctypes_definitions = "deny"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
match_same_arms = "warn"

[features]
default = []

[dependencies]
bevy_abi_mod_sys = { workspace = true }
bevy_abi_mod_host_sys = { workspace = true, features = ["bridge-reflect"] }
bevy_abi_mod_host = { workspace = true }
bevy_app = { workspace = true, features = ["bevy_reflect"] }
bevy_asset = { workspace = true }
bevy_ecs = { workspace = true, features = ["bevy_reflect"] }
bevy_platform = { workspace = true }
bevy_reflect = { workspace = true }
bevy_remote = { workspace = true }
bevy-settings = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
bevy_abi_mod_host_sys = { workspace = true, features = ["bridge-reflect", "test-utils"] }
bevy_abi_mod_macros = { workspace = true }
