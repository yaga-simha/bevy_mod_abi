[package]
name = "bevy_mod_abi"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["bevy_abi_mod authors"]
description = "Canonical Bevy host facade for zero-serialization, asymmetric C-ABI native modding (`ABI 0.3.0`)"
readme = "README.md"
repository = "https://github.com/yaga-simha/bevy_mod_abi"
keywords = ["bevy", "ecs", "ffi", "modding", "plugin"]
categories = ["game-development", "api-bindings"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
improper_ctypes_definitions = "deny"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
match_same_arms = "warn"

[features]
strict-ffi-checks = ["bevy_abi_mod_host/strict-ffi-checks"]
diagnostics = ["bevy_abi_mod_host/diagnostics"]
signature-verification = ["bevy_abi_mod_host/signature-verification"]
hot-reload-watcher = ["dep:bevy_abi_mod_watcher"]
bridge-std-types = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-std-types",
]
bridge-asset = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-asset",
]
bridge-state = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-state",
]
bridge-reflect = ["dep:bevy_abi_mod_reflect"]
bridge-bsn = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-bsn",
    "bridge-asset",
]
sub-app-extract = [
    "dep:bevy_abi_mod_render",
    "bridge-asset",
]
bridge-picking = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-picking",
]
bridge-audio = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-audio",
    "bridge-asset",
]
bridge-camera-2d = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-camera-2d",
]
bridge-light = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-light",
    "bridge-camera-2d",
]
bridge-ui = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-ui",
]
bridge-feathers = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-feathers",
    "bridge-ui",
]
bridge-camera-controller = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-camera-controller",
]
bridge-solari = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/bridge-solari",
]

# Curated bridge presets
preset-2d = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/preset-2d",
    "bridge-std-types",
    "bridge-asset",
    "bridge-state",
    "bridge-picking",
    "bridge-audio",
    "bridge-camera-2d",
    "bridge-ui",
]
preset-3d = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/preset-3d",
    "preset-2d",
    "bridge-light",
    "bridge-camera-controller",
    "bridge-bsn",
]
preset-ui = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/preset-ui",
    "bridge-std-types",
    "bridge-asset",
    "bridge-picking",
    "bridge-ui",
    "bridge-feathers",
]
preset-full = [
    "dep:bevy_abi_mod_bridges",
    "bevy_abi_mod_bridges/preset-full",
    "preset-3d",
    "preset-ui",
    "bridge-solari",
]

[dependencies]
bevy_abi_mod_sys = { workspace = true }
bevy_abi_mod_host = { workspace = true }
bevy_abi_mod_macros = { workspace = true }
bevy_abi_mod_bridges = { workspace = true, optional = true }
bevy_abi_mod_render = { workspace = true, optional = true }
bevy_abi_mod_reflect = { workspace = true, optional = true }
bevy_abi_mod_watcher = { workspace = true, optional = true }

[dev-dependencies]
bevy_app = { workspace = true }
bevy_asset = { workspace = true }
bevy_camera = { workspace = true }
bevy_ecs = { workspace = true }
bevy_input = { workspace = true }
bevy_reflect = { workspace = true }
bevy_remote = { workspace = true }
bevy_scene = { workspace = true }
bevy_state = { workspace = true }
bevy_time = { workspace = true }
bevy_transform = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "bridges_integration"
path = "tests/bridges_integration.rs"
required-features = ["bridge-std-types", "bridge-asset", "bridge-state"]
