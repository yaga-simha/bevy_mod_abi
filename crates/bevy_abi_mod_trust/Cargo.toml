[package]
name = "bevy_abi_mod_trust"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["bevy_abi_mod authors"]
description = "Pure-Rust, zero-Bevy (`#![forbid(unsafe_code)]`) OpenSSH SSHSIG, Ed25519 CA, SSHKRL, embedded `.bam_sig`, and `.bampack` cryptographic verification engine for `bevy_abi_mod`"
readme = "README.md"
repository = "https://github.com/yaga-simha/bevy_mod_abi"
keywords = ["bevy", "ecs", "ffi", "modding", "plugin"]
categories = ["game-development", "api-bindings"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
improper_ctypes_definitions = "deny"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
match_same_arms = "warn"

[features]
default = []
keygen = ["ssh-key/getrandom"]

[dependencies]
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
signature = { workspace = true }
ssh-encoding = { workspace = true }
ssh-key = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
ssh-key = { workspace = true, features = ["getrandom"] }
tempfile = { workspace = true }
