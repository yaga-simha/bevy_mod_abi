[package]
name = "bevy_abi_mod_macros"
version = "0.3.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
authors = ["bevy_abi_mod authors"]
description = "Procedural macros (`#[derive(ModComponent, AbiPod)]`) generating C-ABI VTables, UUIDs, and C/Zig declarations"
readme = "README.md"
repository = "https://github.com/yaga-simha/bevy_mod_abi"
keywords = ["bevy", "ecs", "ffi", "modding", "plugin"]
categories = ["game-development", "api-bindings"]

[lib]
proc-macro = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
improper_ctypes_definitions = "deny"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
match_same_arms = "warn"

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
proc-macro-crate = { workspace = true }

[dev-dependencies]
bevy_abi_mod_sys = { workspace = true }
trybuild = { workspace = true }
