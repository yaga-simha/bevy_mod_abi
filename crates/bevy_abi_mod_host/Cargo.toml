[package]
name = "bevy_abi_mod_host"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["bevy_abi_mod authors"]
description = "Safe (`#![forbid(unsafe_code)]`) headless Bevy ECS plugin, extension traits, and lifecycle messages for `bevy_abi_mod`"
readme = "README.md"
repository = "https://github.com/yaga-simha/bevy_mod_abi"
keywords = ["bevy", "ecs", "ffi", "modding", "plugin"]
categories = ["game-development", "api-bindings"]
autotests = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
improper_ctypes_definitions = "deny"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
match_same_arms = "warn"

[features]
strict-ffi-checks = ["bevy_abi_mod_host_sys/strict-ffi-checks"]
test-utils = ["bevy_abi_mod_host_sys/test-utils"]
diagnostics = ["bevy_abi_mod_host_sys/diagnostics", "dep:bevy_diagnostic"]
signature-verification = ["bevy_abi_mod_host_sys/signature-verification"]

[dependencies]
bevy_abi_mod_sys = { workspace = true }
bevy_abi_mod_manifest = { workspace = true }
bevy_abi_mod_host_sys = { workspace = true }
bevy_abi_mod_macros = { workspace = true }
bevy_ecs = { workspace = true }
bevy_app = { workspace = true }
bevy_platform = { workspace = true }
bevy_diagnostic = { workspace = true, optional = true }
toml = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bevy_abi_mod_host_sys = { workspace = true, features = ["test-utils"] }
bevy_ecs = { workspace = true, features = ["debug"] }
libloading = { workspace = true }
proptest = { workspace = true }
rusty-fork = "0.3"
ssh-key = { workspace = true, features = ["getrandom"] }

[[test]]
name = "ffi"
path = "tests/ffi/main.rs"

[[test]]
name = "scheduling"
path = "tests/scheduling/main.rs"

[[test]]
name = "lifecycle"
path = "tests/lifecycle/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "mod_budgets"
path = "tests/mod_budgets.rs"

[[test]]
name = "schedule_shuffle_fuzz"
path = "../../tests/schedule_shuffle_fuzz.rs"

[[test]]
name = "soak_10k_reloads"
path = "../../tests/soak_10k_reloads.rs"

[[bench]]
name = "chunk_throughput"
path = "benches/chunk_throughput.rs"
harness = false
