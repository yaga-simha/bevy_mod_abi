[package]
name = "bevy_abi_mod_host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Safe (`#![forbid(unsafe_code)]`) Bevy ECS plugin, extension traits, and lifecycle messages for `bevy_abi_mod`"
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
autotests = false

[lints]
workspace = true

[features]
strict-ffi-checks = ["bevy_abi_mod_host_sys/strict-ffi-checks"]
test-utils = ["bevy_abi_mod_host_sys/test-utils"]
diagnostics = ["bevy_abi_mod_host_sys/diagnostics", "dep:bevy_diagnostic"]
signature-verification = ["bevy_abi_mod_host_sys/signature-verification"]
bridge-std-types = [
    "dep:bevy_math",
    "dep:bevy_transform",
    "dep:bevy_camera",
    "dep:bevy_color",
    "dep:bevy_window",
    "dep:bevy_time",
    "dep:bevy_input",
]
bridge-asset = ["dep:bevy_asset"]
bridge-state = ["dep:bevy_state"]
bridge-reflect = ["dep:bevy_reflect"]
bridge-bsn = ["dep:bevy_scene", "bridge-asset"]
sub-app-extract = ["dep:bevy_extract"]
hot-reload-watcher = ["dep:notify-debouncer-full"]

[dependencies]
bevy_abi_mod_sys = { workspace = true }
bevy_abi_mod_host_sys = { workspace = true }
bevy_abi_mod_macros = { workspace = true }
bevy_ecs = { workspace = true }
bevy_app = { workspace = true }
bevy_platform = { workspace = true }
bevy_diagnostic = { workspace = true, optional = true }
bevy_math = { workspace = true, optional = true }
bevy_transform = { workspace = true, optional = true }
bevy_camera = { workspace = true, optional = true }
bevy_color = { workspace = true, optional = true }
bevy_window = { workspace = true, optional = true }
bevy_time = { workspace = true, optional = true }
bevy_input = { workspace = true, optional = true }
bevy_asset = { workspace = true, optional = true }
bevy_state = { workspace = true, optional = true }
bevy_reflect = { workspace = true, optional = true }
bevy_scene = { workspace = true, optional = true }
bevy_extract = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }
toml = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bevy_abi_mod_host_sys = { workspace = true, features = ["test-utils"] }
bevy_ecs = { workspace = true, features = ["debug"] }
libloading = { workspace = true }
proptest = { workspace = true }
rusty-fork = "0.3"
ssh-key = { workspace = true, features = ["getrandom"] }

[[test]]
name = "ffi"
path = "tests/ffi/main.rs"

[[test]]
name = "scheduling"
path = "tests/scheduling/main.rs"

[[test]]
name = "lifecycle"
path = "tests/lifecycle/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[bench]]
name = "chunk_throughput"
path = "benches/chunk_throughput.rs"
harness = false
