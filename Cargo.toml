[workspace]
resolver = "2"
members = [
    "crates/bevy_abi_mod_sys",
    "crates/bevy_abi_mod_macros",
    "crates/bevy_abi_mod_host_sys",
    "crates/bevy_abi_mod_host",
    "crates/bevy_abi_mod_bridges",
    "crates/bevy_abi_mod_render",
    "crates/bevy_abi_mod_reflect",
    "crates/bevy_abi_mod_watcher",
    "crates/bevy_abi_mod_guest_sys",
    "crates/bevy_abi_mod_guest",
    "crates/bevy_abi_mod",
    "crates/bevy_mod_abi",
    "crates/bevy_abi_mod_trust",
    "crates/bevy_abi_mod_manifest",
    "crates/bevy_abi_mod_sdk_gen",
    "crates/cargo-bam",
    "xtask",
    "benches/coupled_rust_mod",
    "benches/permutation_bench",
    "examples/01_minimal_handshake",
    "examples/02_multi_system_pipeline",
    "examples/03_cross_language_interop",
    "examples/04_visual_game",
    "examples/05_cute_3d_winit",
    "examples/06_cross_mod_components",
    "examples/07_cpp17_guest",
    "examples/08_zig_guest",
    "examples/09_bql_wire_parity",
    "examples/10_bevy20_full_companion",
]
default-members = [
    "crates/bevy_abi_mod_sys",
    "crates/bevy_abi_mod_macros",
    "crates/bevy_abi_mod_host_sys",
    "crates/bevy_abi_mod_host",
    "crates/bevy_abi_mod_bridges",
    "crates/bevy_abi_mod_render",
    "crates/bevy_abi_mod_reflect",
    "crates/bevy_abi_mod_watcher",
    "crates/bevy_abi_mod_guest_sys",
    "crates/bevy_abi_mod_guest",
    "crates/bevy_abi_mod",
    "crates/bevy_mod_abi",
    "crates/bevy_abi_mod_trust",
    "crates/bevy_abi_mod_manifest",
    "crates/bevy_abi_mod_sdk_gen",
    "crates/cargo-bam",
    "xtask",
    "examples/01_minimal_handshake",
    "examples/02_multi_system_pipeline",
    "examples/03_cross_language_interop",
    "examples/06_cross_mod_components",
    "examples/07_cpp17_guest",
    "examples/09_bql_wire_parity",
    "examples/10_bevy20_full_companion",
]
exclude = [
    # `shared_scenario` has `crate-type = ["dylib"]` so `permutation_bench` and
    # `coupled_rust_mod` share a single dynamic `bevy_ecs` + `std` image. Keeping it
    # out of root workspace `members` ensures Cargo always compiles it as a non-root
    # dependency with `-C prefer-dynamic`, preventing duplicate `std` link errors
    # during `cargo build` / `cargo build --workspace`.
    "benches/shared_scenario",
    "tests/asymmetric_rust_mod",
    "benches/c_abi_rust_mod",
    "benches/deterministic_gate",
    "fuzz",
    "examples/01_minimal_handshake/guest_mod",
    "examples/02_multi_system_pipeline/guest_mod",
    "examples/03_cross_language_interop/rust_mod",
    "examples/04_visual_game/mods/mod_gravity",
    "examples/04_visual_game/mods/mod_rainbow",
    "examples/04_visual_game/mods/mod_vortex",
    "examples/05_cute_3d_winit/mods/mod_boing",
    "examples/05_cute_3d_winit/mods/mod_carousel",
    "examples/06_cross_mod_components/mods/mod_shield_emitter",
    "examples/06_cross_mod_components/mods/mod_overcharge_siphon",
    "examples/09_bql_wire_parity/rust_mod",
    "examples/10_bevy20_full_companion/guest_mod",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["bevy_abi_mod authors"]
repository = "https://github.com/yaga-simha/bevy_mod_abi"
keywords = ["bevy", "ecs", "ffi", "modding", "plugin"]
categories = ["game-development", "api-bindings"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
improper_ctypes_definitions = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
match_same_arms = "warn"

[workspace.dependencies]
bevy_abi_mod_sys = { version = "0.3.0", path = "crates/bevy_abi_mod_sys" }
bevy_abi_mod_macros = { version = "0.3.0", path = "crates/bevy_abi_mod_macros" }
bevy_abi_mod_host_sys = { version = "0.3.0", path = "crates/bevy_abi_mod_host_sys" }
bevy_abi_mod_host = { version = "0.3.0", path = "crates/bevy_abi_mod_host" }
bevy_abi_mod_bridges = { version = "0.3.0", path = "crates/bevy_abi_mod_bridges" }
bevy_abi_mod_render = { version = "0.3.0", path = "crates/bevy_abi_mod_render" }
bevy_abi_mod_reflect = { version = "0.3.0", path = "crates/bevy_abi_mod_reflect" }
bevy_abi_mod_watcher = { version = "0.3.0", path = "crates/bevy_abi_mod_watcher" }
bevy_abi_mod_guest_sys = { version = "0.3.0", path = "crates/bevy_abi_mod_guest_sys" }
bevy_abi_mod_guest = { version = "0.3.0", path = "crates/bevy_abi_mod_guest" }
bevy_abi_mod = { version = "0.3.0", path = "crates/bevy_abi_mod" }
bevy_mod_abi = { version = "0.3.0", path = "crates/bevy_mod_abi" }
bevy_abi_mod_trust = { version = "0.3.0", path = "crates/bevy_abi_mod_trust" }
bevy_abi_mod_manifest = { version = "0.3.0", path = "crates/bevy_abi_mod_manifest" }
bevy_abi_mod_sdk_gen = { version = "0.3.0", path = "crates/bevy_abi_mod_sdk_gen" }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "async_executor"] }
bevy_app = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_platform = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_tasks = { version = "0.20.1", default-features = false, features = ["multi_threaded"] }
bevy_diagnostic = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_math = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_transform = { version = "0.20.1", default-features = false, features = ["std", "bevy-support"] }
bevy_camera = { version = "0.20.1", default-features = false }
bevy_color = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_window = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_time = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_input = { version = "0.20.1", default-features = false, features = ["std", "keyboard", "mouse"] }
bevy_asset = { version = "0.20.1", default-features = false, features = ["multi_threaded"] }
bevy_state = { version = "0.20.1", default-features = false, features = ["std", "bevy_app"] }
bevy_reflect = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_remote = { version = "0.20.1", default-features = false }
bevy-settings = { version = "0.20.1", default-features = false }
bevy_scene = { version = "0.20.1", default-features = false }
bevy_extract = { version = "0.20.1", default-features = false }
bevy_shader = { version = "0.20.1", default-features = false }
bevy_material = { version = "0.20.1", default-features = false }
bevy_render = { version = "0.20.1", default-features = false }
bevy_sprite = { version = "0.20.1", default-features = false }
bevy_sprite_render = { version = "0.20.1", default-features = false }
bevy_pbr = { version = "0.20.1", default-features = false }
bevy_image = { version = "0.20.1", default-features = false }
bevy_picking = { version = "0.20.1", default-features = false }
bevy_audio = { version = "0.20.1", default-features = false }
bevy_light = { version = "0.20.1", default-features = false }
bevy_ui = { version = "0.20.1", default-features = false }
bevy_text = { version = "0.20.1", default-features = false }
bevy_ui_widgets = { version = "0.20.1", default-features = false }
bevy_input_focus = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_feathers = { version = "0.20.1", default-features = false }
bevy_camera_controller = { version = "0.20.1", default-features = false }
bevy_solari = { version = "0.20.1", default-features = false }
toml = "0.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
notify-debouncer-full = "0.7"
sha2 = "0.10"
tempfile = "3"
libloading = "0.8"
nonmax = "0.5"
arc-swap = "1.7"
thiserror = "2"
tracing = "0.1"
loom = "0.7"
proptest = "1"
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3"
trybuild = "1.0"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519"] }
ssh-encoding = { version = "0.2", default-features = false, features = ["std", "pem", "sha2"] }
signature = { version = "2", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", default-features = false }
