[workspace]
resolver = "2"
members = [
    "crates/abi_contract",
    "crates/mod_derive",
    "crates/host_runtime",
    "crates/guest_sdk",
    "benches/coupled_rust_mod",
    "benches/permutation_bench",
    "examples/01_minimal_handshake",
    "examples/02_multi_system_pipeline",
    "examples/03_cross_language_interop",
    "examples/04_visual_game",
    "examples/05_cute_3d_winit",
    "examples/06_cross_mod_components",
]
exclude = [
    # `shared_scenario` has `crate-type = ["dylib"]` so `permutation_bench` and
    # `coupled_rust_mod` share a single dynamic `bevy_ecs` + `std` image. Keeping it
    # out of root workspace `members` ensures Cargo always compiles it as a non-root
    # dependency with `-C prefer-dynamic`, preventing duplicate `std` link errors
    # during `cargo build` / `cargo build --workspace`.
    "benches/shared_scenario",
    "tests/asymmetric_rust_mod",
    "benches/c_abi_rust_mod",
    "examples/01_minimal_handshake/guest_mod",
    "examples/02_multi_system_pipeline/guest_mod",
    "examples/03_cross_language_interop/rust_mod",
    "examples/04_visual_game/mods/mod_gravity",
    "examples/04_visual_game/mods/mod_rainbow",
    "examples/04_visual_game/mods/mod_vortex",
    "examples/05_cute_3d_winit/mods/mod_boing",
    "examples/05_cute_3d_winit/mods/mod_carousel",
    "examples/06_cross_mod_components/mods/mod_shield_emitter",
    "examples/06_cross_mod_components/mods/mod_overcharge_siphon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["bevy_abi_mod authors"]

[workspace.dependencies]
abi_contract = { path = "crates/abi_contract" }
mod_derive = { path = "crates/mod_derive" }
host_runtime = { path = "crates/host_runtime" }
guest_sdk = { path = "crates/guest_sdk" }
libloading = "0.8"
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
