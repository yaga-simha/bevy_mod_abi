[workspace]
resolver = "2"
members = [
    "crates/abi_contract",
    "crates/mod_derive",
    "crates/host_runtime",
    "crates/guest_sdk",
]
exclude = [
    "tests/asymmetric_rust_mod",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["bevy_abi_mod authors"]
repository = "https://github.com/example/bevy_abi_mod"

[workspace.dependencies]
abi_contract = { path = "crates/abi_contract" }
mod_derive = { path = "crates/mod_derive" }
host_runtime = { path = "crates/host_runtime" }
guest_sdk = { path = "crates/guest_sdk" }
libloading = "0.8"
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
