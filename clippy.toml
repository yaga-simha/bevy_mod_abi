# Workspace Clippy Configuration
# Tune thresholds to accommodate idiomatic Bevy systems and complex ECS query tuples
too-many-arguments-threshold = 12
type-complexity-threshold = 350

# Allow recognized engine & FFI acronyms in doc comments without spurious linting
doc-valid-idents = [
    "Bevy",
    "ABI",
    "VTable",
    "Entity",
    "World",
    "AbiPod",
    "StrView",
    "C99",
]
