# cargo-deny configuration for `bevy_abi_mod`
# Validates security advisories, SPDX licenses, duplicate crate bans (including Bevy), and registries.

[graph]
all-features = true
exclude-dev = false

[advisories]
version = 2
yanked = "warn"
unused-ignored-advisory = "allow"
ignore = [
    # Transitive via `ratatui 0.29.0` (`example_04_visual_game`); no safe upstream upgrade exists.
    "RUSTSEC-2024-0436",
    # Transitive weak optional dependency in `ssh-key 0.6.7` lockfile (`rsa?/std`); RSA is
    # disabled at compile time (`features = ["std", "ed25519"]`) and rejected at runtime.
    "RUSTSEC-2023-0071",
    # Transitive weak optional dependency in `ssh-key 0.6.7` lockfile (ECDSA crates);
    # never compiled under `ed25519`-only feature selection.
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "NCSA",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

# Strictly forbid duplicate `bevy*` versions across the workspace graph.
deny = [
    { crate = "bevy", deny-multiple-versions = true },
    { crate = "bevy_app", deny-multiple-versions = true },
    { crate = "bevy_ecs", deny-multiple-versions = true },
    { crate = "bevy_platform", deny-multiple-versions = true },
    { crate = "bevy_ptr", deny-multiple-versions = true },
    { crate = "bevy_tasks", deny-multiple-versions = true },
    { crate = "bevy_utils", deny-multiple-versions = true },
]

skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
